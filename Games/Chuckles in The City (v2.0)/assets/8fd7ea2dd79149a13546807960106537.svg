<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="316.14999" height="258.75" viewBox="0,0,316.14999,258.75"><g transform="translate(-74.25,-14.75)"><g fill="#ffffff" stroke="none" stroke-miterlimit="10" font-family="Handwriting" font-weight="400" font-size="40"><text transform="translate(74.5,34) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff"><tspan x="0" dy="0">As Chuckles looks over the horizon, </tspan><tspan x="0" dy="46.150000000000006px">he wonders something.</tspan><tspan x="0" dy="46.150000000000006px">He wonders how long violence must</tspan><tspan x="0" dy="46.150000000000006px">go on...</tspan><tspan x="0" dy="46.150000000000006px">How much pain, torment, and suffering</tspan><tspan x="0" dy="46.150000000000006px">must be inflicted before everyone is</tspan><tspan x="0" dy="46.150000000000006px">satisifed?</tspan><tspan x="0" dy="46.150000000000006px">Chuckles does not want to fight, </tspan><tspan x="0" dy="46.150000000000006px">but he must...</tspan><tspan x="0" dy="46.150000000000006px">for only he can save the world from the </tspan><tspan x="0" dy="46.150000000000006px">accursed evils that roam it. </tspan></text></g></g></svg>