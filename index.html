<!DOCTYPE html>
<html>
  <head>
    <title>Chuckles in the City</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">

      <link rel="icon" href="Pictures/Chuckles Icon.png">
      <link rel="stylesheet" href="Styles/general.css">
      <link rel="stylesheet" href="Styles/header.css">
      <link rel="stylesheet" href="Styles/home-page.css">
      <link rel="stylesheet" href="Styles/footer.css">

  </head>
  <body>
    <header class="header">
      <div class="home-button-div">
        <a href="index.html">
          <img class="button" src="Pictures/home.png" alt="home button">
        </a>
        <div class="tooltip">Home Page</div>
      </div>
    
      <div class="download-button-div">
        <a href="download.html">
          <img class="button" src="Pictures/Download.png" alt="downloads button">
        </a>
        <div class="tooltip">Downloads</div>
      </div>

      <div class="play-button-div">
        <a href="play.html">
        <img class="button" src="Pictures/play.png" alt="play game button">
        </a>
        <div class="tooltip">Play Game</div>
      </div>

      <div class="changelog-button-div">
        <a href="changelog.html">
          <img class="button" src="Pictures/changelog.png" alt="changelog button">
        </a>  
        <div class="tooltip">Changelog</div>
      </div>

      <div class="credits-button-div">
        <a href="credits.html">
          <img class="button" src="Pictures/credits.png" alt="credits button">
        </a>
        <div class="tooltip">Credits</div>
      </div>

      <div class="about-button-div">
        <a href="about.html">
          <img class="button" src="Pictures/about.png" alt="about information button">
        </a>
        <div class="tooltip">About</div>
      </div>

      </div>      
    </header>

    <main>
      <div class="content">
      <section class="grid">
        <div>
          <img class="chuckles-image" src="Pictures/Chuckles.png" alt="Image of Chuckles" title="Chuckles">
        </div>

        <div>
          <p class="welcome-text">
            Welcome to the official website of <img class="game-logo" src="Pictures/Chuckles Logo.png"></p>
        </div>
      </section>

      <section class="images-and-sign-grid">
        <div class="images-grid">
          <img class="home-images" src="Pictures/A.png" alt="Gameplay Image 1">
          <img class="home-images" src="Pictures/B.png" alt="Gameplay Image 2">
          <img class="home-images" src="Pictures/C.png" alt="Gameplay Image 3">
          <img class="home-images" src="Pictures/version 2.1 image.png" alt="Gameplay Image 4">
        </div>

        <div>
          <img class="news-sign" src="Pictures/news-sign.png" alt="News Sign">
        </div>
      </section>
     </div>
    <footer class="footer">
      &#169; 2026 TheChaosTraveler. All rights reserved.
    </footer>
    </main> 
  </body>
</html>
