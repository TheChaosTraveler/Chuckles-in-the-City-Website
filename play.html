<!DOCTYPE html>
<html>
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="icon" href="Pictures/Chuckles Icon.png">
    <link rel="stylesheet" href="Styles/general.css">
    <link rel="stylesheet" href="Styles/header.css">

    <link rel="stylesheet" href="Styles/footer.css">

  </head>
  <body>
      <header class="header">
        <div class="home-button-div">
          <a href="index.html">
            <img class="button" src="Pictures/home.png" alt="home button">
          </a>
          <div class="tooltip">Home Page</div>
        </div>
      
        <div class="download-button-div">
          <a href="download.html">
            <img class="button" src="Pictures/Download.png" alt="downloads button">
          </a>
          <div class="tooltip">Downloads</div>
        </div>
      
        <div class="play-button-div">
          <a href="play.html">
            <img class="button" src="Pictures/play.png" alt="play game button">
          </a>
          <div class="tooltip">Play Game</div>
        </div>
      
        <div class="changelog-button-div">
          <a href="changelog.html">
            <img class="button" src="Pictures/changelog.png" alt="changelog button">
          </a>
          <div class="tooltip">Changelog</div>
        </div>
      
        <div class="credits-button-div">
          <a href="credits.html">
            <img class="button" src="Pictures/credits.png" alt="credits button">
          </a>
          <div class="tooltip">Credits</div>
        </div>
      
        <div class="about-button-div">
          <a href="about.html">
            <img class="button" src="Pictures/about.png" alt="about information button">
          </a>
          <div class="tooltip">About</div>
        </div>
      
        </div>
      </header>

      <p class="title-text">

        <div class="game-outline">
          <div>
            <img class="game-image" src="Pictures/version 2.1 image.png" alt="image of game">

          <div class="play-game-grid">
            <a href="play-v2.1.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
        
            <p class="version-text">
              Play Version 2.1
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 8/13/2026
            </p>
          </div>
        </div>

        <div class="game-outline">
          <div>
            <img class="game-image" src="Pictures/A.png" alt="image of game">
          </div>
          <div class="play-game-grid">
            <a href="play-v2.0.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
      
            <p class="version-text">
              Play Version 2.0
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 7/29/2026
            </p>
          </div>
        </div>
      
        <div class="game-outline">
          <div class="game-image-div">
            <img class="game-image" src="Pictures/D.png" alt="image of game">
          </div>
          <div class="play-game-grid">
            <a href="play-v1.3.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
      
            <p class="version-text">
              Play Version 1.3
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 1/11/2025
            </p>
          </div>
        </div>
