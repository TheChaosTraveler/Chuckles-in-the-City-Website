<!DOCTYPE html>
<html>
  <head>

    <title>Play Chuckles in the City</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">

    <link rel="icon" href="Pictures/Chuckles Icon.png">
    <link rel="stylesheet" href="Styles/general.css">
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/play.css">
    <link rel="stylesheet" href="Styles/footer.css">

  </head>
  <body>
      <header class="header">
        <div class="home-button-div">
          <a href="index.html">
            <img class="button" src="Pictures/home.png" alt="home button">
          </a>
          <div class="tooltip">Home Page</div>
        </div>
      
        <div class="download-button-div">
          <a href="download.html">
            <img class="button" src="Pictures/Download.png" alt="downloads button">
          </a>
          <div class="tooltip">Downloads</div>
        </div>
      
        <div class="play-button-div">
          <a href="play.html">
            <img class="button" src="Pictures/play.png" alt="play game button">
          </a>
          <div class="tooltip">Play Game</div>
        </div>
      
        <div class="changelog-button-div">
          <a href="changelog.html">
            <img class="button" src="Pictures/changelog.png" alt="changelog button">
          </a>
          <div class="tooltip">Changelog</div>
        </div>
      
        <div class="credits-button-div">
          <a href="credits.html">
            <img class="button" src="Pictures/credits.png" alt="credits button">
          </a>
          <div class="tooltip">Credits</div>
        </div>
      
        <div class="about-button-div">
          <a href="about.html">
            <img class="button" src="Pictures/about.png" alt="about information button">
          </a>
          <div class="tooltip">About</div>
        </div>
      
        </div>
      </header>

    <main>
      <div class="content">
      <p class="title-text">
        Play <img class="game-logo" src="Pictures/Chuckles Logo.png"> in your browser!
      </p>
      
      <section class="game-grid">
        <div class="game-outline">
          <div>
            <img class="game-image" src="Pictures/v2.1 title and logo.png" alt="image of game">
          </div>
          <div class="play-game-grid">
            <a href="play-v2.1.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
        
            <p class="version-text">
              Play Version 2.1
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 8/13/2026
            </p>
          </div>
        </div>

        <div class="game-outline">
          <div>
            <img class="game-image" src="Pictures/A2.png" alt="image of game">
          </div>
          <div class="play-game-grid">
            <a href="play-v2.0.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
      
            <p class="version-text">
              Play Version 2.0
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 7/29/2026
            </p>
          </div>
        </div>
      
        <div class="game-outline">
          <div class="game-image-div">
            <img class="game-image" src="Pictures/D.png" alt="image of game">
          </div>
          <div class="play-game-grid">
            <a href="play-v1.3.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
      
            <p class="version-text">
              Play Version 1.3
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 1/11/2025
            </p>
          </div>
        </div>      
      
      </section>

      <p class="title-text">
        Bonus Games
      </p>

      <section class="bonus-game-grid game-grid">
  
        <div class="js-bonus-game-outline bonus-game-outline game-outline" data-game="chuckiladre">
          <p class="bonus-question-mark">?</p>
        </div>

        <div class="js-bonus-game-outline bonus-game-outline game-outline" data-game="chuckles3d">
          <p class="bonus-question-mark">?</p>
        </div>
      
      </section>

      <div class="bonus-game-box-div">
        <div class="bonus-game-search-border">
          <input type="search" class="js-bonus-game-input-box bonus-game-input-box" placeholder="Input Codes Here to Unlock More Games...">
        </div>
      </div>   
      
      <p class="js-game-unlock-text game-unlock-text"></p>

      <button class="js-reset-games-button reset-games-button">
        Clear Unlocked Games Data (reload required to display)
      </button>

      </div>
      <footer class="footer">
        &#169; 2026 TheChaosTraveler. All rights reserved.
      </footer>
    </main>

    <script>
      const bonusGameInput = document.querySelector('.js-bonus-game-input-box');
      let unlockText = document.querySelector('.js-game-unlock-text');

      const unlockedGames = JSON.parse(localStorage.getItem('unlocks')) ||
      {
        chuckles3d: 0,
        chuckiladre: 0
      };

      if (unlockedGames.chuckles3d === 1) {
        chuckles3d();
      }

      if (unlockedGames.chuckiladre === 1) {
        chuckiladre();
      }

      document.querySelector('.js-reset-games-button').addEventListener('click', () => {
        localStorage.removeItem('unlocks');
      });

      bonusGameInput.value = '';

      bonusGameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          if (bonusGameInput.value === 'I want to be 3d!') {
            chuckles3d();
            unlockedGames.chuckles3d = 1;
            localStorage.setItem('unlocks', JSON.stringify(unlockedGames));
          } else if (bonusGameInput.value === 'What does it mean to be Chuckled?') {
            chuckiladre();
            unlockedGames.chuckiladre = 1;
            localStorage.setItem('unlocks', JSON.stringify(unlockedGames));
          }
        }
      })

      function chuckles3d () {
        document.querySelectorAll('.js-bonus-game-outline')
          .forEach((box) => {
            if (box.dataset.game === 'chuckles3d') {
              box.outerHTML = `<div class="game-outline">
          <div class="game-image-div" >
            <img class="game-image" src="Pictures/Chuckles3D.png" alt="image of game">
          </div>
          <div class="play-game-grid">
            <a href="play-3d.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
      
            <p class="version-text">
               Chuckles in the City 3D
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 10/11/2026
            </p>
          </div>
        </div>`;
            }
          });
          //unlockedText();
          bonusGameInput.value = '';
      }

      function chuckiladre () {
        document.querySelectorAll('.js-bonus-game-outline')
          .forEach((box) => {
            if (box.dataset.game === 'chuckiladre') {
              box.outerHTML = `<div class="game-outline">
          <div class="game-image-div" >
            <img class="game-image" src="Pictures/Chuckiladre.jpg" alt="image of game">
          </div>
          <div class="play-game-grid">
            <a href="play-chuckiladre.html">
              <img class="play-game-button" src="Pictures/play-game.png" alt="play game" title="Play Game">
            </a>
      
            <p class="version-text">
               Chuckiladre's Realm
            </p>
          </div>
          <div>
            <p class="release-date">
              Release Date: 10/11/2026
            </p>
          </div>
        </div>`;
            }
          });
        //unlockedText();
        bonusGameInput.value = '';
      }

      /*function unlockedText () {
        if (bonusGameInput.value === 'I want to be 3d!' && unlockedGames.chuckles3d === 0) {
          unlockText.innerHTML = 'You unlocked Chuckles in the City 3D!'
        } else if (bonusGameInput === 'What does it mean to be Chuckled?' && unlockedGames.chuckiladre === 0) {
          unlockText.innerHTML = "You unlocked Chuckiladre's Realm!"
        }
      }
        */
      
    </script>
  </body>
</html>
